          description: >-
            DeploymentStartStatus is the stack status captured when the current

            deployment starts. It is used by deployment logic during the current

            deployment attempt and is cleared/replaced when a new deployment begins.
          example: 1
        DeploymentStatus:
          description: >-
            DeploymentStatus records the status progression of the current
            deployment.

            Cleared when a new deployment starts.
          items:
            $ref: "#/components/schemas/portainer.StackDeploymentStatus"
          type: array
        EndpointId:
          description: Environment(Endpoint) identifier. Reference the
            environment(endpoint) that will be used for deployment
          example: 1
          type: integer
        EntryPoint:
          description: >-
            EntryPoint is the path to the config file relative to the project
            root.

            NOTE: For git stacks this mirrors GitConfig.ConfigFilePath and the two are kept in sync

            by stackUpdateGit. The deploy command builder (compose_unpacker_cmd_builder) uses this

            field directly; Kubernetes deploy and git clone operations use GitConfig.ConfigFilePath.
          example: docker-compose.yml
          type: string
        Env:
          description: A list of environment(endpoint) variables used during stack
            deployment
          items:
            $ref: "#/components/schemas/portainer.Pair"
          type: array
        FromAppTemplate:
          description: Whether the stack is from a app template
          example: false
          type: boolean
        GitConfig:
          allOf:
            - $ref: "#/components/schemas/gittypes.RepoConfig"
          description: >-
            GitConfig is the git repository configuration for git-backed stacks.

            Deprecated: loaded from Source via WorkflowID; kept for DB backwards-compatibility only.

            Non-migration code must not read or write this field; use Source records instead.
        GitSourceId:
          type: integer
        Id:
          description: Stack Identifier
          example: 1
          type: integer
        Name:
          description: Stack name
          example: myStack
          type: string
        Namespace:
          description: Kubernetes namespace if stack is a kube application
          example: default
          type: string
        Option:
          allOf:
            - $ref: "#/components/schemas/portainer.StackOption"
          description: The stack deployment option
        ProjectPath:
          description: Path on disk to the repository hosting the Stack file
          example: /data/compose/myStack_jpofkc0i9uo9wtx1zesuk649w
          type: string
        ResourceControl:
          $ref: "#/components/schemas/portainer.ResourceControl"
        Status:
          allOf:
            - $ref: "#/components/schemas/portainer.StackStatus"
          description: Stack status (1 - active, 2 - inactive, 3 - deploying, 4 - error)
          example: 1
        SwarmId:
          description: Cluster identifier of the Swarm cluster where the stack is deployed
          example: jpofkc0i9uo9wtx1zesuk649w
          type: string
        Type:
          allOf:
            - $ref: "#/components/schemas/portainer.StackType"
          description: Stack type. 1 for a Swarm stack, 2 for a Compose stack
          example: 2
        UpdateDate:
          description: The date in unix time when stack was last updated
          example: 1587399600
          type: integer
        UpdatedBy:
          description: The username which last updated this stack
          example: bob
          type: string
        WorkflowID:
          description: WorkflowID is the ID of the Workflow that owns the Source for this
            stack.
          type: integer
      type: object
