        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/system.nodesCountResponse"
        "500":
          description: Server error
      summary: Retrieve the count of nodes
      tags:
        - system
  /system/status:
    get:
      description: |-
        Retrieve Portainer status
        **Access policy**: public
      operationId: systemStatus
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/system.status"
      summary: Check Portainer status
      tags:
        - system
  /system/version:
    get:
      description: |-
        Check if portainer has an update available
        **Access policy**: authenticated
      operationId: systemVersion
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/system.versionResponse"
      summary: Check for portainer updates
      tags:
        - system
  /templates:
    get:
      description: |-
        List available templates.
        **Access policy**: authenticated
      operationId: TemplateList
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/templates.listResponse"
        "500":
          description: Server error
      summary: List available templates
      tags:
        - templates
  "/templates/{id}/file":
    post:
      description: |-
        Get a template's file
        **Access policy**: authenticated
      operationId: TemplateFile
      parameters:
        - description: Template identifier
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/templates.fileResponse"
        "400":
          description: Invalid request
        "500":
          description: Server error
      summary: Get a template's file
      tags:
        - templates
  "/upload/tls/{certificate}":
    post:
      description: |-
        Use this environment(endpoint) to upload TLS files.
        **Access policy**: administrator
      operationId: UploadTLS
      parameters:
        - description: TLS file type. Valid values are 'ca', 'cert' or 'key'.
          in: path
          name: certificate
          required: true
          schema:
            type: string
            enum:
              - ca
              - cert
              - key
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                folder:
                  description: Folder where the TLS file will be stored. Will be created if not
                    existing
                  type: string
                file:
                  description: The file to upload
                  type: string
                  format: binary
              required:
                - folder
                - file
        required: true
      responses:
        "204":
          description: Success
        "400":
          description: Invalid request
        "500":
          description: Server error
      summary: Upload TLS files
      tags:
        - upload
  "/users/{id}":
    get:
      description: >-
        Retrieve the local operator's record (UI preferences). Any other
        identifier is refused.

        User passwords are filtered out, and should never be accessible.

        **Access policy**: local
      operationId: UserInspect
      parameters:
        - description: Local operator identifier
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/portainer.User"
        "400":
          description: Invalid request
        "403":
          description: Permission denied
        "404":
          description: User not found
        "500":
          description: Server error
      summary: Inspect the local operator
      tags:
        - users
    put:
      description: |-
        Update the local operator's theme and UI cache preference.
        **Access policy**: local
      operationId: UserUpdate
      parameters:
        - description: Local operator identifier
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/users.userUpdatePayload"
        description: UI preferences
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/portainer.User"
        "400":
          description: Invalid request
        "403":
          description: Permission denied
        "404":
          description: User not found
        "500":
          description: Server error
      summary: Update the UI preferences
      tags:
        - users
  /users/me:
    get:
      description: |-
        Retrieve the local operator's record (UI preferences).
        User passwords are filtered out, and should never be accessible.
        **Access policy**: local
      operationId: CurrentUserInspect
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/portainer.User"
        "400":
          description: Invalid request
        "403":
          description: Permission denied
        "404":
          description: User not found
        "500":
          description: Server error
      summary: Inspect the local operator
      tags:
        - users
  /websocket/attach:
    get:
      description: |-
        The request will be upgraded to the websocket protocol and
        an AttachStart operation HTTP request will be created and hijacked.
        **Access policy**: authenticated
      parameters:
        - description: environment(endpoint) ID of the environment(endpoint) where the
            resource is located
          in: query
          name: endpointId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Attach a websocket
      tags:
        - websocket
  /websocket/exec:
    get:
      description: |-
        The request will be upgraded to the websocket protocol and
        an ExecStart operation HTTP request will be created and hijacked.
      parameters:
        - description: environment(endpoint) ID of the environment(endpoint) where the
            resource is located
          in: query
          name: endpointId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "409":
          description: Conflict
        "500":
          description: Internal Server Error
      summary: Execute a websocket
      tags:
        - websocket
